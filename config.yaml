# Hugo site configuration — xiongpin.dev
# Docs: https://gohugo.io/configuration/all/

baseURL: "https://xiongpin.dev/"
languageCode: "en-us"
defaultContentLanguage: "en"
title: "Xiong Pin"
theme: "PaperMod"

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Xiong Pin"
  description: "Notes on distributed systems, cloud architecture, and AI-assisted engineering — written from real production work."
  keywords: [Blog, Cloud, AWS, Distributed Systems, AI Coding]
  author: "Xiong Pin"

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi, I'm Xiong Pin"
    Content: >
      I work on cloud architecture and distributed systems.
      Here I write up engineering problems I actually hit in production — what broke,
      how I debugged it, and what I'd do differently next time.

  socialIcons:
    - name: github
      url: "https://github.com/pinxiong"
    - name: linkedin
      url: "https://www.linkedin.com/in/pinxiong"
    - name: rss
      url: "index.xml"

  social:
    twitter: ""
    facebook_admin: ""

  editPost:
    URL: "https://github.com/pinxiong/pinxiong.github.io/tree/master/content"
    Text: "Suggest changes"
    appendFilePath: true

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true
    guessSyntax: true
    style: "github"
  tableOfContents:
    startLevel: 2
    endLevel: 4

taxonomies:
  tag: "tags"
  category: "categories"

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
