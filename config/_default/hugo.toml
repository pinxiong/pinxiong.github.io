# -- Site configuration --
# Theme: Blowfish, vendored in themes/blowfish (pinned version in BLOWFISH_VERSION).
# Theme docs: https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://xiongpin.dev/"
title = "Pin Xiong"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false
buildExpired = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 20
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 80

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10

[minify]
  disableXML = true
  minifyOutput = true

# Blowfish v3.8 uses site.Language.Locale, which landed in Hugo 0.162.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.165.0"
