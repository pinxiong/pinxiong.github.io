# -- Theme options --
# Docs: https://blowfish.page/docs/configuration/#theme-parameters
#
# Kept deliberately small: this site is a quiet place to publish engineering
# notes. Anything not listed here falls back to the theme default.

colorScheme = "blowfish" # calm blue accent
defaultAppearance = "light"
autoSwitchAppearance = true # follow the OS setting, and let readers toggle

enableA11y = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = false

mainSections = ["posts"]

fingerprintAlgorithm = "sha512"

[header]
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page"
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = false
  cardViewScreenWidth = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showAuthorBottom = true
  showHero = false
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = true
  editURL = "https://github.com/pinxiong/pinxiong.github.io/tree/master/content/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = false
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showCategories = false
  showTags = true
  showWordCount = true
  showZenMode = false
  # 阅读量/点赞开关：等 [firebase] 填入真实配置后再置 true 并部署
  showViews = false
  showLikes = false
  sharingLinks = ["linkedin", "x-twitter", "email"]

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = false
  showTableOfContents = false
  showCards = false
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showTableOfContents = false
  groupByYear = false
  cardView = false

[seo]

# 阅读量/点赞后端（Blowfish 原生支持，Firebase Firestore + 匿名登录）
# 用户在 Firebase 控制台拿到以下 7 个值后填入，然后把上面 [article] 里的
# showViews / showLikes 改为 true 并重新部署即可生效。
[firebase]
  apiKey = ""
  authDomain = ""
  projectId = ""
  storageBucket = ""
  messagingSenderId = ""
  appId = ""
  measurementId = ""
