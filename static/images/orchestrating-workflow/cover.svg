<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgDark8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2547"/>
      <stop offset="1" stop-color="#14407c"/>
    </linearGradient>
    <marker id="covArr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7db4ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bgDark8)"/>
  <circle cx="1520" cy="60" r="320" fill="#16407a"/>
  <circle cx="40" cy="880" r="260" fill="#103258"/>
  <rect x="110" y="104" width="300" height="40" rx="20" fill="#1d4ed8"/>
  <text x="260" y="130" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">STRANDS IN ACTION · 08</text>
  <!-- title -->
  <text x="108" y="316" font-size="68" font-weight="800" fill="#ffffff">Less Freedom for</text>
  <text x="108" y="400" font-size="68" font-weight="800" fill="#ffffff">the Model, More</text>
  <text x="108" y="484" font-size="68" font-weight="800" fill="#7db4ff">Certainty for You</text>
  <!-- subtitle -->
  <text x="110" y="556" font-size="25" fill="#c3d6f2">The dependency graph fixes the order in Python.</text>
  <text x="110" y="592" font-size="25" fill="#c3d6f2">Upstream results arrive as text: no contract, no replay.</text>
  <!-- footer -->
  <text x="110" y="796" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#8fb3e3">strands-agents 1.63.0 · every claim verified by running it</text>

  <!-- right visual: fixed order, no replay, no budget checkpoint -->
  <rect x="950" y="150" width="470" height="180" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="985" y="190" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">order   research, calc, write</text>
  <text x="985" y="222" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">timeout=1   ran 7.06s  completed</text>
  <text x="985" y="254" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">restart 14s  order=[]  running</text>
  <text x="985" y="286" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#ffffff">metrics = plain text, no budget</text>
  <text x="985" y="316" font-size="13" fill="#5f83b8" font-family="ui-monospace, Menlo, monospace">strands-agents-tools 0.8.11, us-east-1</text>

  <line x1="1185" y1="330" x2="1185" y2="412" stroke="#7db4ff" stroke-width="2.5" marker-end="url(#covArr8)"/>

  <rect x="950" y="420" width="225" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1062" y="464" font-size="30" font-weight="700" fill="#9cc2ff" text-anchor="middle">0</text>
  <text x="1062" y="492" font-size="13.5" fill="#9cc2ff" text-anchor="middle">steps replayed from history</text>

  <rect x="1195" y="420" width="255" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1322" y="464" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">3944</text>
  <text x="1322" y="492" font-size="13.5" fill="#9cc2ff" text-anchor="middle">tokens, text only</text>

  <!-- takeaway chip -->
  <rect x="950" y="576" width="470" height="92" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1185" y="616" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">order is yours, the contract is not</text>
  <text x="1185" y="646" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8fb3e3" text-anchor="middle">no schema, no resume, no budget checkpoint</text>

</svg>
