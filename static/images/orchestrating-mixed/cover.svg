<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgDark10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2547"/>
      <stop offset="1" stop-color="#14407c"/>
    </linearGradient>
    <marker id="covArr10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7db4ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bgDark10)"/>
  <circle cx="1520" cy="60" r="320" fill="#16407a"/>
  <circle cx="40" cy="880" r="260" fill="#103258"/>
  <rect x="110" y="104" width="300" height="40" rx="20" fill="#1d4ed8"/>
  <text x="260" y="130" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">STRANDS IN ACTION · 10</text>
  <!-- title -->
  <text x="108" y="316" font-size="68" font-weight="800" fill="#ffffff">Three Orchestrators,</text>
  <text x="108" y="400" font-size="68" font-weight="800" fill="#ffffff">One Process,</text>
  <text x="108" y="484" font-size="68" font-weight="800" fill="#7db4ff">Three Adapters</text>
  <!-- subtitle -->
  <text x="110" y="556" font-size="25" fill="#c3d6f2">Graph fixes the order, Workflow renders text, Swarm keeps a dict.</text>
  <text x="110" y="592" font-size="25" fill="#c3d6f2">Only one of those crosses the boundary: the text.</text>
  <!-- footer -->
  <text x="110" y="796" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#8fb3e3">strands-agents 1.63.0 · every claim verified by running it</text>

  <!-- right visual: three data channels, only text crosses -->
  <rect x="950" y="150" width="470" height="180" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="985" y="190" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">graph      state.results -&gt; text</text>
  <text x="985" y="222" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">workflow   raw text, 100.0%</text>
  <text x="985" y="254" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#8fb3e3">swarm      SharedContext [0 reach]</text>
  <text x="985" y="286" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#ffffff">sentinel SWARM-7Q2: never arrives</text>
  <text x="985" y="316" font-size="13" fill="#5f83b8" font-family="ui-monospace, Menlo, monospace">strands-agents 1.63.0, tools 0.8.11</text>

  <line x1="1185" y1="330" x2="1185" y2="412" stroke="#7db4ff" stroke-width="2.5" marker-end="url(#covArr10)"/>

  <rect x="950" y="420" width="225" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1062" y="464" font-size="30" font-weight="700" fill="#9cc2ff" text-anchor="middle">0</text>
  <text x="1062" y="492" font-size="13.5" fill="#9cc2ff" text-anchor="middle">structured fields cross</text>

  <rect x="1195" y="420" width="255" height="96" rx="12" fill="#1a4a8f" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1322" y="464" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">+3599</text>
  <text x="1322" y="492" font-size="13.5" fill="#9cc2ff" text-anchor="middle">tokens for one nested swarm</text>

  <!-- takeaway chip -->
  <rect x="950" y="576" width="470" height="92" rx="14" fill="#123a6b" stroke="#4f8ff7" stroke-width="2"/>
  <text x="1185" y="616" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">composes at the API, not the data layer</text>
  <text x="1185" y="646" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8fb3e3" text-anchor="middle">the adapters are the whole finding</text>

</svg>
