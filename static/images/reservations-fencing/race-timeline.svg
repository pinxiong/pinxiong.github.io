<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="460" fill="#f8fafc"/>
  <text x="60" y="52" font-size="26" font-weight="bold" fill="#0f172a">The delayed commit race (naive reconciler)</text>
  <text x="60" y="80" font-size="15" fill="#475569">one slot, one idempotency key K, real clock, trial 1 of 5</text>

  <!-- time axis: t=0..3.0s mapped to x=220..1120, x(t)=220+300t -->
  <line x1="220" y1="390" x2="1120" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <g font-size="13" fill="#64748b" text-anchor="middle">
    <line x1="220" y1="385" x2="220" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="220" y="415">0s</text>
    <line x1="370" y1="385" x2="370" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="370" y="415">0.5s</text>
    <line x1="520" y1="385" x2="520" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="520" y="415">1.0s</text>
    <line x1="670" y1="385" x2="670" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="670" y="415">1.5s</text>
    <line x1="820" y1="385" x2="820" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="820" y="415">2.0s</text>
    <line x1="970" y1="385" x2="970" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="970" y="415">2.5s</text>
    <line x1="1120" y1="385" x2="1120" y2="395" stroke="#94a3b8" stroke-width="2"/><text x="1120" y="415">3.0s</text>
  </g>

  <!-- old attempt lane: 0s -> commit 2.405s (x=941.5) -->
  <text x="200" y="148" font-size="14" fill="#0f172a" text-anchor="end">old attempt</text>
  <rect x="220" y="130" width="721.5" height="26" rx="6" fill="#2563eb" opacity="0.18"/>
  <line x1="220" y1="130" x2="220" y2="156" stroke="#2563eb" stroke-width="3"/>
  <circle cx="941.5" cy="143" r="9" fill="#b45309"/>
  <text x="941.5" y="118" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">commits at 2.405s</text>
  <text x="941.5" y="176" font-size="13" fill="#b45309" text-anchor="middle">write #2 lands</text>
  <text x="440" y="148" font-size="13" fill="#1e40af">in flight the whole time (2.4s workload)</text>

  <!-- janitor lane: expiry 1.005s (x=521.5) -->
  <text x="200" y="248" font-size="14" fill="#0f172a" text-anchor="end">janitor</text>
  <line x1="521.5" y1="218" x2="521.5" y2="260" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="521.5" cy="239" r="9" fill="#2563eb"/>
  <text x="521.5" y="206" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">lease expires at 1.003s</text>
  <text x="521.5" y="282" font-size="13" fill="#1e40af" text-anchor="middle">looks up K: not found, releases capacity</text>

  <!-- retry lane: 1.005s -> commit 1.407s (x=642.1) -->
  <text x="200" y="348" font-size="14" fill="#0f172a" text-anchor="end">retry</text>
  <rect x="521.5" y="330" width="120.6" height="26" rx="6" fill="#2563eb" opacity="0.18"/>
  <line x1="521.5" y1="330" x2="521.5" y2="356" stroke="#2563eb" stroke-width="3"/>
  <circle cx="642.1" cy="343" r="9" fill="#b45309"/>
  <text x="642.1" y="318" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">commits at 1.407s</text>
  <text x="642.1" y="376" font-size="13" fill="#b45309" text-anchor="middle">write #1 lands</text>

  <!-- result banner -->
  <rect x="220" y="428" width="900" height="26" rx="6" fill="#fef3c7"/>
  <text x="670" y="447" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">two writes, one ticket: duplicate_writes=1 in 5 of 5 runs</text>
</svg>
