<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" width="560" height="530" role="img" aria-labelledby="acTitle">
  <title id="acTitle">AI coding mapped onto the four layers of a technology</title>
  <rect width="560" height="530" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="20" y="24" width="520" height="44" rx="12" fill="#f59e0b"/>
    <text x="40" y="54" font-size="21" font-weight="700" fill="#ffffff">Syntax and usage</text>
    <text x="40" y="96" font-size="16" fill="#334155">the wording of a prompt · how the tool is configured · what its</text>
    <text x="40" y="118" font-size="16" fill="#334155">slash commands are called</text>

    <rect x="20" y="142" width="520" height="44" rx="12" fill="#f97316"/>
    <text x="40" y="172" font-size="21" font-weight="700" fill="#ffffff">Framework and tooling</text>
    <text x="40" y="214" font-size="16" fill="#334155">Cursor · Claude Code · Kiro · Qoder, and the like</text>

    <rect x="20" y="238" width="520" height="44" rx="12" fill="#14b8a6"/>
    <text x="40" y="268" font-size="21" font-weight="700" fill="#ffffff">Paradigm</text>
    <text x="40" y="310" font-size="16" fill="#334155">how you hand over context · how you frame the environment · how the</text>
    <text x="40" y="332" font-size="16" fill="#334155">loop is ordered: requirements → design → tasks, with steering files</text>
    <text x="40" y="354" font-size="16" fill="#334155">holding the project context around it</text>

    <rect x="20" y="378" width="520" height="44" rx="12" fill="#2563eb"/>
    <text x="40" y="408" font-size="21" font-weight="700" fill="#ffffff">Principle and mechanism</text>
    <text x="40" y="450" font-size="16" fill="#334155">how the LLM works underneath · why it hallucinates · why the context</text>
    <text x="40" y="472" font-size="16" fill="#334155">window is a hard limit · why an agent needs a verification loop</text>
  </g>
</svg>
