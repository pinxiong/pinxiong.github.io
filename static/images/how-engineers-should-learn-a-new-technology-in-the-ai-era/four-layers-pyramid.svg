<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 920" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="A technology as a four-layer pyramid: syntax and usage on top, then framework and tooling, then paradigm, with principle and mechanism at the base; lifetimes run from months to decades">
  <defs>
    <filter id="tshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="varrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============ tier 1 · syntax and usage ============ -->
  <rect x="100" y="56" width="440" height="200" rx="20" fill="#d97706" filter="url(#tshadow)"/>
  <line x1="130" y1="62" x2="510" y2="62" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="104" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Syntax and usage</text>
  <text x="320" y="136" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">Months</text>
  <line x1="250" y1="154" x2="390" y2="154" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="320" y="190" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">How exactly do I write it?</text>
  <text x="320" y="222" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">YAML fields, CLI flags,</text>
  <text x="320" y="246" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">the exact wording of a prompt</text>

  <!-- ============ tier 2 · framework and tooling ============ -->
  <rect x="80" y="266" width="480" height="200" rx="20" fill="#ea580c" filter="url(#tshadow)"/>
  <line x1="110" y1="272" x2="530" y2="272" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="314" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Framework and tooling</text>
  <text x="320" y="346" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">Two to three years</text>
  <line x1="250" y1="364" x2="390" y2="364" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="320" y="400" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Which product do I use?</text>
  <text x="320" y="432" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">Docker, Kubernetes,</text>
  <text x="320" y="456" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">one particular AI coding tool</text>

  <!-- ============ tier 3 · paradigm ============ -->
  <rect x="60" y="476" width="520" height="200" rx="20" fill="#0d9488" filter="url(#tshadow)"/>
  <line x1="90" y1="482" x2="550" y2="482" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="524" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Paradigm</text>
  <text x="320" y="556" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">Five to ten years</text>
  <line x1="250" y1="574" x2="390" y2="574" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="320" y="610" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Which class of idea is this?</text>
  <text x="320" y="642" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">Containerization, declarative</text>
  <text x="320" y="666" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">orchestration, serverless</text>

  <!-- ============ tier 4 · principle and mechanism ============ -->
  <rect x="40" y="686" width="560" height="200" rx="20" fill="#2563eb" filter="url(#tshadow)"/>
  <line x1="70" y1="692" x2="570" y2="692" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="734" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Principle and mechanism</text>
  <text x="320" y="766" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff" fill-opacity="0.85">Decades</text>
  <line x1="250" y1="784" x2="390" y2="784" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="320" y="820" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">What holds it up?</text>
  <text x="320" y="852" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">TCP/IP semantics, process scheduling,</text>
  <text x="320" y="876" text-anchor="middle" font-size="22" fill="#ffffff" fill-opacity="0.8">virtual memory</text>

  <!-- ============ depth axis ============ -->
  <line x1="30" y1="76" x2="30" y2="866" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#varrow)"/>
  <text x="12" y="470" text-anchor="middle" font-size="19" font-weight="600" fill="#94a3b8" transform="rotate(-90 12 470)">lasts longer</text>
</svg>
