<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="560" height="404" role="img" aria-labelledby="flTitle">
  <title id="flTitle">The four layers of a technology: the question each one answers, how long it lasts and what it covers</title>
  <rect width="560" height="404" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="20" y="31" width="200" height="74" rx="14" fill="#f59e0b"/>
    <text x="120" y="61" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Syntax and usage</text>
    <text x="120" y="85" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">Months</text>
    <line x1="246" y1="68" x2="238" y2="68" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,68 238,63 238,73" fill="#94a3b8"/>
    <text x="252" y="54" font-size="15" fill="#334155" font-style="italic">how exactly do I write it?</text>
    <text x="252" y="70" font-size="15" fill="#334155">YAML fields · CLI flags ·</text>
    <text x="252" y="86" font-size="15" fill="#334155">the wording of a prompt</text>

    <rect x="20" y="115" width="200" height="74" rx="14" fill="#f97316"/>
    <text x="120" y="145" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Framework and tooling</text>
    <text x="120" y="169" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">One to three years</text>
    <line x1="246" y1="152" x2="238" y2="152" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,152 238,147 238,157" fill="#94a3b8"/>
    <text x="252" y="138" font-size="15" fill="#334155" font-style="italic">which product do I use?</text>
    <text x="252" y="154" font-size="15" fill="#334155">Docker · Kubernetes · one</text>
    <text x="252" y="170" font-size="15" fill="#334155">particular AI coding tool</text>

    <rect x="20" y="199" width="200" height="74" rx="14" fill="#14b8a6"/>
    <text x="120" y="229" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Paradigm</text>
    <text x="120" y="253" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">Five to ten years</text>
    <line x1="246" y1="236" x2="238" y2="236" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,236 238,231 238,241" fill="#94a3b8"/>
    <text x="252" y="222" font-size="15" fill="#334155" font-style="italic">which philosophy is this?</text>
    <text x="252" y="238" font-size="15" fill="#334155">containerization · declarative</text>
    <text x="252" y="254" font-size="15" fill="#334155">orchestration · serverless</text>

    <rect x="20" y="283" width="200" height="74" rx="14" fill="#2563eb"/>
    <text x="120" y="305" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Principle and</text>
    <text x="120" y="325" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mechanism</text>
    <text x="120" y="345" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">Decades</text>
    <line x1="246" y1="320" x2="238" y2="320" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,320 238,315 238,325" fill="#94a3b8"/>
    <text x="252" y="306" font-size="15" fill="#334155" font-style="italic">what holds it up?</text>
    <text x="252" y="322" font-size="15" fill="#334155">TCP/IP protocol · process</text>
    <text x="252" y="338" font-size="15" fill="#334155">scheduling · virtual memory</text>

    <text x="280" y="388" font-size="15" fill="#64748b" text-anchor="middle">The further down, the longer it lasts.</text>
  </g>
</svg>
