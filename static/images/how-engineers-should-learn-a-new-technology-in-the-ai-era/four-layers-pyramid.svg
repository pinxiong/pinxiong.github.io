<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" role="img" aria-labelledby="flTitle">
  <title id="flTitle">The four layers of a technology: the question each one answers, how long it lasts and what it covers</title>
  <rect width="560" height="540" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="50" y="20" width="460" height="106" rx="14" fill="#f59e0b"/>
    <text x="76" y="58" font-size="21" font-weight="700" fill="#ffffff">Syntax and usage</text>
    <text x="484" y="58" font-size="15" fill="#ffffff" opacity="0.85" text-anchor="end">Months</text>
    <text x="76" y="84" font-size="15" fill="#ffffff" opacity="0.92">“how exactly do I write it?”</text>
    <text x="76" y="110" font-size="14" fill="#ffffff" opacity="0.82">YAML fields · CLI flags · the exact wording of a prompt</text>

    <rect x="38" y="140" width="485" height="106" rx="14" fill="#f97316"/>
    <text x="64" y="178" font-size="21" font-weight="700" fill="#ffffff">Framework and tooling</text>
    <text x="497" y="178" font-size="15" fill="#ffffff" opacity="0.85" text-anchor="end">One to three years</text>
    <text x="64" y="204" font-size="15" fill="#ffffff" opacity="0.92">“which product do I use?”</text>
    <text x="64" y="230" font-size="14" fill="#ffffff" opacity="0.82">Docker · Kubernetes · one particular AI coding tool</text>

    <rect x="25" y="260" width="510" height="106" rx="14" fill="#14b8a6"/>
    <text x="51" y="298" font-size="21" font-weight="700" fill="#ffffff">Paradigm</text>
    <text x="509" y="298" font-size="15" fill="#ffffff" opacity="0.85" text-anchor="end">Five to ten years</text>
    <text x="51" y="324" font-size="15" fill="#ffffff" opacity="0.92">“which philosophy is this?”</text>
    <text x="51" y="350" font-size="14" fill="#ffffff" opacity="0.82">containerization · declarative orchestration · serverless</text>

    <rect x="13" y="380" width="535" height="106" rx="14" fill="#2563eb"/>
    <text x="39" y="418" font-size="21" font-weight="700" fill="#ffffff">Principle and mechanism</text>
    <text x="522" y="418" font-size="15" fill="#ffffff" opacity="0.85" text-anchor="end">Decades</text>
    <text x="39" y="444" font-size="15" fill="#ffffff" opacity="0.92">“what holds it up?”</text>
    <text x="39" y="470" font-size="14" fill="#ffffff" opacity="0.82">TCP/IP protocol · process scheduling · virtual memory</text>

    <text x="280" y="518" font-size="16" fill="#64748b" text-anchor="middle">The further down, the longer it lasts.</text>
  </g>
</svg>
