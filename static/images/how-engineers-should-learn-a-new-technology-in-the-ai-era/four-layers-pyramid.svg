<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-labelledby="flTitle">
  <title id="flTitle">The four layers of a technology and how long each one lasts</title>
  <rect width="560" height="490" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="110" y="20" width="340" height="96" rx="14" fill="#f59e0b"/>
    <text x="138" y="62" font-size="26" font-weight="700" fill="#ffffff">Syntax and usage</text>
    <text x="138" y="92" font-size="17" fill="#ffffff" opacity="0.88">Months</text>

    <rect x="85" y="126" width="390" height="96" rx="14" fill="#f97316"/>
    <text x="113" y="168" font-size="26" font-weight="700" fill="#ffffff">Framework and tooling</text>
    <text x="113" y="198" font-size="17" fill="#ffffff" opacity="0.88">Two to three years</text>

    <rect x="60" y="232" width="440" height="96" rx="14" fill="#14b8a6"/>
    <text x="88" y="274" font-size="26" font-weight="700" fill="#ffffff">Paradigm</text>
    <text x="88" y="304" font-size="17" fill="#ffffff" opacity="0.88">Five to ten years</text>

    <rect x="35" y="338" width="490" height="96" rx="14" fill="#2563eb"/>
    <text x="63" y="380" font-size="26" font-weight="700" fill="#ffffff">Principle and mechanism</text>
    <text x="63" y="410" font-size="17" fill="#ffffff" opacity="0.88">Decades</text>

    <text x="280" y="468" font-size="16" fill="#64748b" text-anchor="middle">The further down, the longer it lasts.</text>
  </g>
</svg>
