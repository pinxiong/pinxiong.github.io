<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="cvdTitle">
  <title id="cvdTitle">Cover: how to learn in the AI era — bet early on the top two layers, hold on to the bottom two, abstract whatever you learn</title>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#0d1c3a"/>
    </linearGradient>
    <radialGradient id="dglowA" cx="0.1" cy="0.02" r="0.8">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dglowB" cx="0.95" cy="0.95" r="0.85">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dglowC" cx="0.5" cy="1.2" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#463414"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
    <linearGradient id="dg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d403c"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
    <linearGradient id="dg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173561"/>
      <stop offset="1" stop-color="#1b2236"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" fill="url(#dbg)"/>
  <rect width="1000" height="420" fill="url(#dglowA)"/>
  <rect width="1000" height="420" fill="url(#dglowB)"/>
  <rect width="1000" height="420" fill="url(#dglowC)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="56" y="54" width="34" height="4" rx="2" fill="#fbbf24"/>
    <text x="104" y="61" font-size="15" font-weight="700" letter-spacing="2.2" fill="#fbbf24">A FOUR-LAYER MODEL · THREE MOVES</text>

    <text x="56" y="148" font-size="58" font-weight="800" fill="#ffffff">HOW TO LEARN</text>
    <text x="56" y="212" font-size="58" font-weight="800" fill="#ffffff">IN THE <tspan fill="#38bdf8">AI ERA</tspan></text>

    <rect x="868" y="125" width="82" height="18" rx="9" fill="#fbbf24" opacity="0.22"/>
    <rect x="874" y="128" width="70" height="12" rx="6" fill="#fbbf24"/>
    <rect x="838" y="142" width="112" height="18" rx="9" fill="#fb923c" opacity="0.22"/>
    <rect x="844" y="145" width="100" height="12" rx="6" fill="#fb923c"/>
    <rect x="808" y="159" width="142" height="18" rx="9" fill="#2dd4bf" opacity="0.22"/>
    <rect x="814" y="162" width="130" height="12" rx="6" fill="#2dd4bf"/>
    <rect x="778" y="176" width="172" height="18" rx="9" fill="#60a5fa" opacity="0.22"/>
    <rect x="784" y="179" width="160" height="12" rx="6" fill="#60a5fa"/>

    <rect x="56" y="248" width="282" height="120" rx="16" fill="url(#dg1)" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M 72 248 H 322 A 16 16 0 0 1 338 264 V 254 H 56 V 264 A 16 16 0 0 1 72 248 Z" fill="#f59e0b"/>
    <text x="76" y="314" font-size="28" font-weight="800" fill="#fbbf24">BET EARLY</text>
    <text x="76" y="344" font-size="15" fill="#cbd5e1">on the top two layers</text>

    <rect x="359" y="248" width="282" height="120" rx="16" fill="url(#dg2)" stroke="#14b8a6" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M 375 248 H 625 A 16 16 0 0 1 641 264 V 254 H 359 V 264 A 16 16 0 0 1 375 248 Z" fill="#14b8a6"/>
    <text x="379" y="314" font-size="28" font-weight="800" fill="#2dd4bf">HOLD ON</text>
    <text x="379" y="344" font-size="15" fill="#cbd5e1">to the bottom two layers</text>

    <rect x="662" y="248" width="282" height="120" rx="16" fill="url(#dg3)" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M 678 248 H 928 A 16 16 0 0 1 944 264 V 254 H 662 V 264 A 16 16 0 0 1 678 248 Z" fill="#3b82f6"/>
    <text x="682" y="314" font-size="28" font-weight="800" fill="#60a5fa">ABSTRACT</text>
    <text x="682" y="344" font-size="15" fill="#cbd5e1">whatever you learn</text>
  </g>
</svg>
