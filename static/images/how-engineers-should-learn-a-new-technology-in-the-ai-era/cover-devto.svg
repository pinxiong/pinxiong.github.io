<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="cvdTitle">
  <title id="cvdTitle">Cover: how to learn in the AI era — bet early on the top two layers, hold on to the bottom two, abstract whatever you learn</title>
  <rect width="1000" height="420" fill="#0f172a"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="56" y="54" width="34" height="4" rx="2" fill="#fbbf24"/>
    <text x="104" y="61" font-size="15" font-weight="700" letter-spacing="2.2" fill="#fbbf24">A FOUR-LAYER MODEL · THREE MOVES</text>

    <text x="56" y="148" font-size="58" font-weight="800" fill="#ffffff">HOW TO LEARN</text>
    <text x="56" y="212" font-size="58" font-weight="800" fill="#ffffff">IN THE <tspan fill="#60a5fa">AI ERA</tspan></text>

    <rect x="874" y="128" width="70" height="12" rx="6" fill="#f59e0b"/>
    <rect x="844" y="145" width="100" height="12" rx="6" fill="#f97316"/>
    <rect x="814" y="162" width="130" height="12" rx="6" fill="#14b8a6"/>
    <rect x="784" y="179" width="160" height="12" rx="6" fill="#2563eb"/>

    <rect x="56" y="248" width="282" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="76" y="266" width="36" height="4" rx="2" fill="#f59e0b"/>
    <text x="76" y="318" font-size="28" font-weight="800" fill="#ffffff">BET EARLY</text>
    <text x="76" y="348" font-size="15" fill="#94a3b8">on the top two layers</text>

    <rect x="359" y="248" width="282" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="379" y="266" width="36" height="4" rx="2" fill="#14b8a6"/>
    <text x="379" y="318" font-size="28" font-weight="800" fill="#ffffff">HOLD ON</text>
    <text x="379" y="348" font-size="15" fill="#94a3b8">to the bottom two layers</text>

    <rect x="662" y="248" width="282" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="682" y="266" width="36" height="4" rx="2" fill="#3b82f6"/>
    <text x="682" y="318" font-size="28" font-weight="800" fill="#ffffff">ABSTRACT</text>
    <text x="682" y="348" font-size="15" fill="#94a3b8">whatever you learn</text>
  </g>
</svg>
