<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="dsTitle">
  <title id="dsTitle">Six stages that answered where the code runs, from the 1990s to 2014</title>
  <rect width="560" height="520" fill="#ffffff"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

    <line x1="96" y1="40" x2="96" y2="460" stroke="#cbd5e1" stroke-width="2"/>

    <circle cx="96" cy="40" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="47" font-size="19" font-weight="700" fill="#3b82f6" text-anchor="end">1990s</text>
    <text x="118" y="42" font-size="19" font-weight="700" fill="#0f172a">Own hardware</text>
    <text x="118" y="68" font-size="15" fill="#64748b">The starting point</text>

    <circle cx="96" cy="124" r="9" fill="#0ea5e9" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="131" font-size="19" font-weight="700" fill="#0ea5e9" text-anchor="end">2001</text>
    <text x="118" y="126" font-size="19" font-weight="700" fill="#0f172a">x86 virtualization</text>
    <text x="118" y="152" font-size="15" fill="#64748b">One machine, one operating system: wasteful</text>

    <circle cx="96" cy="208" r="9" fill="#22d3ee" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="215" font-size="19" font-weight="700" fill="#22d3ee" text-anchor="end">2006</text>
    <text x="118" y="210" font-size="19" font-weight="700" fill="#0f172a">Cloud (EC2)</text>
    <text x="118" y="236" font-size="15" fill="#64748b">Buying machines and building data centers: slow and costly</text>

    <circle cx="96" cy="292" r="9" fill="#2dd4bf" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="299" font-size="19" font-weight="700" fill="#2dd4bf" text-anchor="end">2013</text>
    <text x="118" y="294" font-size="19" font-weight="700" fill="#0f172a">Containers (Docker)</text>
    <text x="118" y="320" font-size="15" fill="#64748b">Environments differed and delivery was slow</text>

    <circle cx="96" cy="376" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="383" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="end">2014</text>
    <text x="118" y="378" font-size="19" font-weight="700" fill="#0f172a">Orchestration (Kubernetes)</text>
    <text x="118" y="404" font-size="15" fill="#64748b">Manual scheduling broke down</text>

    <circle cx="96" cy="460" r="9" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
    <text x="76" y="467" font-size="19" font-weight="700" fill="#f97316" text-anchor="end">2014</text>
    <text x="118" y="462" font-size="19" font-weight="700" fill="#0f172a">Functions (Lambda)</text>
    <text x="118" y="488" font-size="15" fill="#64748b">Nobody wanted to manage servers</text>
  </g>
</svg>
