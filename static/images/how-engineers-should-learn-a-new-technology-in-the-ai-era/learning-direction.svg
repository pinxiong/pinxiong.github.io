<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 448" width="560" height="448" role="img" aria-labelledby="ldTitle">
  <title id="ldTitle">How to learn each layer: the top two layers top-down, the bottom two bottom-up, and how deep to go at each</title>
  <rect width="560" height="448" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <!-- band 1: top-down -->
    <rect x="20" y="20" width="520" height="190" rx="18" fill="#fff7ed"/>
    <text x="36" y="50" font-size="14" font-weight="700" fill="#c2410c">↓</text>
    <text x="56" y="50" font-size="13" font-weight="700" letter-spacing="1.6" fill="#c2410c">TOP-DOWN</text>
    <text x="524" y="50" font-size="12" font-style="italic" fill="#c2410c" opacity="0.75" text-anchor="end">start at the surface, work down</text>

    <rect x="36" y="60" width="488" height="64" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <rect x="42" y="70" width="5" height="44" rx="2.5" fill="#f59e0b"/>
    <text x="58" y="97" font-size="15" font-weight="700" fill="#b45309">Syntax and usage</text>
    <text x="254" y="88" font-size="15" fill="#334155">fast and shallow; the wording</text>
    <text x="254" y="106" font-size="15" fill="#334155">is not worth memorising</text>

    <rect x="36" y="132" width="488" height="64" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1"/>
    <rect x="42" y="142" width="5" height="44" rx="2.5" fill="#f97316"/>
    <text x="58" y="169" font-size="15" font-weight="700" fill="#c2410c">Framework and tooling</text>
    <text x="254" y="160" font-size="15" fill="#334155">what the class solves, not just</text>
    <text x="254" y="178" font-size="15" fill="#334155">how to use one product</text>

    <!-- band 2: bottom-up -->
    <rect x="20" y="220" width="520" height="190" rx="18" fill="#eff6ff"/>
    <text x="36" y="250" font-size="14" font-weight="700" fill="#1d4ed8">↑</text>
    <text x="56" y="250" font-size="13" font-weight="700" letter-spacing="1.6" fill="#1d4ed8">BOTTOM-UP</text>
    <text x="524" y="250" font-size="12" font-style="italic" fill="#1d4ed8" opacity="0.75" text-anchor="end">start at the mechanism, build up</text>

    <rect x="36" y="260" width="488" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <rect x="42" y="270" width="5" height="44" rx="2.5" fill="#14b8a6"/>
    <text x="58" y="297" font-size="15" font-weight="700" fill="#0f766e">Paradigm</text>
    <text x="254" y="297" font-size="15" fill="#334155">the design philosophy, not the steps</text>

    <rect x="36" y="332" width="488" height="64" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <rect x="42" y="342" width="5" height="44" rx="2.5" fill="#2563eb"/>
    <text x="58" y="369" font-size="15" font-weight="700" fill="#1d4ed8">Principle and mechanism</text>
    <text x="254" y="360" font-size="15" fill="#334155">the principle, not the details;</text>
    <text x="254" y="378" font-size="15" fill="#334155">keep the skeleton in your head</text>

    <text x="280" y="434" font-size="14" fill="#64748b" text-anchor="middle">Top-down across the top two layers, bottom-up across the bottom two.</text>
  </g>
</svg>
