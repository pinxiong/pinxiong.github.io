<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" width="560" height="404" role="img" aria-labelledby="ldTitle">
  <title id="ldTitle">The four layers with top-down across the top two and bottom-up across the bottom two, each with how deep to go</title>
  <rect width="560" height="404" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <rect x="20" y="31" width="200" height="74" rx="14" fill="#f59e0b"/>
    <text x="120" y="61" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Syntax and usage</text>
    <text x="120" y="85" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">↓ top-down</text>
    <line x1="246" y1="68" x2="238" y2="68" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,68 238,63 238,73" fill="#94a3b8"/>
    <text x="252" y="62" font-size="15" fill="#334155">fast and shallow; the wording</text>
    <text x="252" y="78" font-size="15" fill="#334155">is not worth memorising</text>

    <rect x="20" y="115" width="200" height="74" rx="14" fill="#f97316"/>
    <text x="120" y="145" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Framework and tooling</text>
    <text x="120" y="169" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">↓ top-down</text>
    <line x1="246" y1="152" x2="238" y2="152" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,152 238,147 238,157" fill="#94a3b8"/>
    <text x="252" y="146" font-size="15" fill="#334155">what the class solves, not</text>
    <text x="252" y="162" font-size="15" fill="#334155">just how to use one product</text>

    <rect x="20" y="199" width="200" height="74" rx="14" fill="#14b8a6"/>
    <text x="120" y="229" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Paradigm</text>
    <text x="120" y="253" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">↑ bottom-up</text>
    <line x1="246" y1="236" x2="238" y2="236" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,236 238,231 238,241" fill="#94a3b8"/>
    <text x="252" y="230" font-size="15" fill="#334155">the design philosophy, not the</text>
    <text x="252" y="246" font-size="15" fill="#334155">steps</text>

    <rect x="20" y="283" width="200" height="74" rx="14" fill="#2563eb"/>
    <text x="120" y="305" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Principle and</text>
    <text x="120" y="325" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">mechanism</text>
    <text x="120" y="345" font-size="12" fill="#ffffff" opacity="0.85" text-anchor="middle">↑ bottom-up</text>
    <line x1="246" y1="320" x2="238" y2="320" stroke="#94a3b8" stroke-width="2.5"/>
    <polygon points="228,320 238,315 238,325" fill="#94a3b8"/>
    <text x="252" y="314" font-size="15" fill="#334155">the principle, not the details;</text>
    <text x="252" y="330" font-size="15" fill="#334155">keep the skeleton in your head</text>

    <text x="280" y="388" font-size="15" fill="#64748b" text-anchor="middle">Top-down across the top two layers, bottom-up across the bottom two.</text>
  </g>
</svg>
