<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" role="img" aria-labelledby="ldTitle">
  <title id="ldTitle">The four layers with a top-down arrow across the top two and a bottom-up arrow across the bottom two</title>
  <rect width="560" height="390" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">

    <rect x="170" y="20" width="370" height="64" rx="14" fill="#f59e0b"/>
    <text x="355" y="60" font-size="20" font-weight="700" fill="#ffffff">Syntax and usage</text>

    <rect x="170" y="100" width="370" height="64" rx="14" fill="#f97316"/>
    <text x="355" y="140" font-size="20" font-weight="700" fill="#ffffff">Framework and tooling</text>

    <rect x="170" y="180" width="370" height="64" rx="14" fill="#14b8a6"/>
    <text x="355" y="220" font-size="20" font-weight="700" fill="#ffffff">Paradigm</text>

    <rect x="170" y="260" width="370" height="64" rx="14" fill="#2563eb"/>
    <text x="355" y="300" font-size="20" font-weight="700" fill="#ffffff">Principle and mechanism</text>

    <line x1="142" y1="26" x2="142" y2="146" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="142,162 133,144 151,144" fill="#94a3b8"/>
    <text x="124" y="99" font-size="17" font-weight="600" fill="#64748b" text-anchor="end">top-down</text>

    <line x1="142" y1="318" x2="142" y2="198" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="142,182 133,200 151,200" fill="#94a3b8"/>
    <text x="124" y="259" font-size="17" font-weight="600" fill="#64748b" text-anchor="end">bottom-up</text>

    <text x="280" y="362" font-size="16" fill="#64748b">The same four layers, read in two directions.</text>
  </g>
</svg>
