<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Kiro&#8217;s core capabilities</text>

  <!-- ================= Specs (blue) ================= -->
  <rect x="20" y="54" width="470" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="54" width="6" height="200" rx="3" fill="#2563eb"/>
  <text x="52" y="94" font-size="19" font-weight="700" fill="#0f172a"><tspan fill="#2563eb">01</tspan>  Specs</text>
  <circle cx="58" cy="126" r="3" fill="#2563eb"/>
  <text x="72" y="131" font-size="14" fill="#334155"><tspan font-weight="600">requirements.md &#8594; design.md &#8594; tasks.md</tspan></text>
  <circle cx="58" cy="156" r="3" fill="#2563eb"/>
  <text x="72" y="161" font-size="14" fill="#334155">human approval gates between phases</text>
  <rect x="52" y="196" width="330" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="217" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">a prompt is a wish &#8212; a spec is a contract</text>
  <text x="460" y="216" text-anchor="end" font-size="11" fill="#94a3b8">kiro.dev/docs/specs</text>

  <!-- ================= Steering (orange) ================= -->
  <rect x="510" y="54" width="470" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="510" y="54" width="6" height="200" rx="3" fill="#ea580c"/>
  <text x="542" y="94" font-size="19" font-weight="700" fill="#0f172a"><tspan fill="#ea580c">02</tspan>  Steering</text>
  <circle cx="548" cy="126" r="3" fill="#ea580c"/>
  <text x="562" y="131" font-size="14" fill="#334155">project conventions <tspan font-weight="600">written once, auto-loaded when relevant</tspan></text>
  <circle cx="548" cy="156" r="3" fill="#ea580c"/>
  <text x="562" y="161" font-size="14" fill="#334155">foundation: <tspan font-family="Menlo, monospace" font-size="12.5">product &#183; tech &#183; structure</tspan></text>
  <circle cx="548" cy="186" r="3" fill="#ea580c"/>
  <text x="562" y="191" font-size="14" fill="#334155">inclusion modes <tspan fill="#64748b">&#8212; AGENTS.md can&#8217;t do that</tspan></text>
  <text x="950" y="244" text-anchor="end" font-size="11" fill="#94a3b8">kiro.dev/docs/steering</text>

  <!-- ================= Hooks (teal) ================= -->
  <rect x="20" y="274" width="470" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="20" y="274" width="6" height="200" rx="3" fill="#0d9488"/>
  <text x="52" y="314" font-size="19" font-weight="700" fill="#0f172a"><tspan fill="#0d9488">03</tspan>  Hooks</text>
  <circle cx="58" cy="344" r="3" fill="#0d9488"/>
  <text x="72" y="349" font-size="14" fill="#334155">events you define &#183; your action runs on trigger</text>
  <circle cx="58" cy="372" r="3" fill="#0d9488"/>
  <text x="72" y="377" font-size="14" fill="#334155">on file save: auto-run lint / format / type checks</text>
  <circle cx="58" cy="400" r="3" fill="#0d9488"/>
  <text x="72" y="405" font-size="14" fill="#334155">gate dangerous operations before they run</text>
  <circle cx="58" cy="428" r="3" fill="#0d9488"/>
  <text x="72" y="433" font-size="14" fill="#334155">auto-create tests / docs on new files</text>
  <text x="460" y="464" text-anchor="end" font-size="11" fill="#94a3b8">kiro.dev/docs/hooks</text>

  <!-- ================= Custom Agents (purple) ================= -->
  <rect x="510" y="274" width="470" height="200" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="510" y="274" width="6" height="200" rx="3" fill="#7c3aed"/>
  <text x="542" y="314" font-size="19" font-weight="700" fill="#0f172a"><tspan fill="#7c3aed">04</tspan>  Custom Agents</text>
  <circle cx="548" cy="344" r="3" fill="#7c3aed"/>
  <text x="562" y="349" font-size="14" fill="#334155">customize an agent&#8217;s behavior to your needs</text>
  <circle cx="548" cy="372" r="3" fill="#7c3aed"/>
  <text x="562" y="377" font-size="14" fill="#334155">per-task tools, permissions and context</text>
  <circle cx="548" cy="400" r="3" fill="#7c3aed"/>
  <text x="562" y="405" font-size="14" fill="#334155">pre-approve tools &#183; restrict what they may call</text>
  <circle cx="548" cy="428" r="3" fill="#7c3aed"/>
  <text x="562" y="433" font-size="14" fill="#334155">rules for tool calls &#183; task-specific context</text>
  <text x="950" y="464" text-anchor="end" font-size="11" fill="#94a3b8">kiro.dev/docs/custom-agents</text>
</svg>
