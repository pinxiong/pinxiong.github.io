<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 334" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <!-- ================= panel 1 · coding time ================= -->
  <rect x="20" y="20" width="300" height="250" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="170" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8" letter-spacing="1">CODING TIME PER TASK</text>
  <text x="170" y="112" text-anchor="middle" font-size="24" fill="#94a3b8" text-decoration="line-through">1 week</text>
  <text x="170" y="150" text-anchor="middle" font-size="22" font-weight="800" fill="#2563eb">&#8595;</text>
  <text x="170" y="210" text-anchor="middle" font-size="48" font-weight="800" fill="#1d4ed8">4 hours</text>
  <rect x="123" y="228" width="94" height="30" rx="15" fill="#2563eb"/>
  <text x="170" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">10&#215; faster</text>

  <!-- ================= panel 2 · person-months ================= -->
  <rect x="350" y="20" width="300" height="250" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c" letter-spacing="1">PERSON-MONTHS</text>
  <text x="500" y="112" text-anchor="middle" font-size="21" fill="#94a3b8" text-decoration="line-through">2 people &#183; 1 month</text>
  <text x="500" y="150" text-anchor="middle" font-size="22" font-weight="800" fill="#ea580c">&#8595;</text>
  <text x="500" y="210" text-anchor="middle" font-size="32" font-weight="800" fill="#c2410c">1 person &#183; 2 weeks</text>
  <rect x="405" y="228" width="190" height="30" rx="15" fill="#ea580c"/>
  <text x="500" y="248" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4&#215; fewer person-months</text>

  <!-- ================= panel 3 · first-pass rate ================= -->
  <rect x="680" y="20" width="300" height="250" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="830" y="58" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857" letter-spacing="1">FIRST-PASS RATE</text>
  <text x="830" y="112" text-anchor="middle" font-size="24" fill="#94a3b8" text-decoration="line-through">0 tests</text>
  <text x="830" y="150" text-anchor="middle" font-size="22" font-weight="800" fill="#059669">&#8595;</text>
  <text x="830" y="210" text-anchor="middle" font-size="48" font-weight="800" fill="#047857">90%</text>
  <rect x="712" y="228" width="236" height="30" rx="15" fill="#059669"/>
  <text x="830" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">on 98% API coverage from Step 2</text>

  <!-- ================= footer ================= -->
  <rect x="265" y="290" width="470" height="34" rx="17" fill="#0f172a"/>
  <text x="500" y="312" text-anchor="middle" font-size="13.5" font-weight="600" fill="#ffffff"><tspan fill="#34d399">&#10003;</tspan> Zero production incidents through the grayscale rollout.</text>
</svg>
