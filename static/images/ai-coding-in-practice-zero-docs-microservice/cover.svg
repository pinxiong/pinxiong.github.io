<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0d1830"/>
      <stop offset="1" stop-color="#0f2240"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#172554" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pillTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#042f2e" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pillGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#052e16" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- right-side network motif: docs dissolving into service nodes -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 760 300 L 850 240 L 950 260 L 1030 200"/>
    <path d="M 780 360 L 880 330 L 980 360 L 1080 330"/>
    <path d="M 800 420 L 900 430 L 1010 470 L 1100 450"/>
    <path d="M 850 240 L 880 330"/>
    <path d="M 950 260 L 980 360"/>
    <path d="M 880 330 L 900 430"/>
    <path d="M 1030 200 L 1080 330"/>
    <path d="M 980 360 L 1010 470"/>
  </g>
  <g fill="#1d4ed8" opacity="0.9">
    <circle cx="760" cy="300" r="5"/>
    <circle cx="780" cy="360" r="5"/>
    <circle cx="800" cy="420" r="5"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="850" cy="240" r="6"/>
    <circle cx="880" cy="330" r="7"/>
    <circle cx="900" cy="430" r="6"/>
  </g>
  <g fill="#14b8a6">
    <circle cx="950" cy="260" r="6"/>
    <circle cx="980" cy="360" r="6"/>
    <circle cx="1010" cy="470" r="6"/>
  </g>
  <g fill="#e2e8f0" opacity="0.8">
    <circle cx="1030" cy="200" r="4"/>
    <circle cx="1080" cy="330" r="4"/>
    <circle cx="1100" cy="450" r="4"/>
  </g>
  <!-- hexagon core -->
  <g transform="translate(920,300)">
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#0d1830" stroke="#3b82f6" stroke-width="2.5"/>
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="10" text-anchor="middle" font-size="30" font-weight="700" fill="#93c5fd">&lt;/&gt;</text>
  </g>

  <!-- kicker -->
  <rect x="80" y="88" width="46" height="4" fill="#f59e0b"/>
  <text x="140" y="97" font-size="21" font-weight="700" letter-spacing="5" fill="#f59e0b">SPEC-DRIVEN AI CODING · FIELD REPORT</text>

  <!-- hero numbers -->
  <text x="80" y="235" font-size="96" font-weight="800" fill="#f8fafc">13<tspan dx="18" font-size="60" font-weight="700" fill="#60a5fa" dy="0">STEPS</tspan></text>
  <text x="80" y="345" font-size="96" font-weight="800" fill="#f8fafc">0<tspan dx="18" font-size="60" font-weight="700" fill="#60a5fa" dy="0">DOCS</tspan></text>

  <!-- subtitle -->
  <text x="82" y="420" font-size="27" fill="#cbd5e1">Refactoring a two-year-old production microservice</text>
  <text x="82" y="456" font-size="27" fill="#cbd5e1">that had zero documentation</text>

  <!-- bottom result pills: two-line (label / value) -->
  <g>
    <rect x="80" y="520" width="340" height="80" rx="40" fill="url(#pillBlue)" stroke="#3b82f6" stroke-width="2"/>
    <text x="116" y="551" font-size="14" font-weight="700" letter-spacing="2.5" fill="#93c5fd">CODING TIME</text>
    <text x="116" y="582" font-size="24" font-weight="800" fill="#f1f5f9">1 week <tspan dx="6" fill="#93c5fd">&#8594; 4 hours</tspan></text>
  </g>
  <g>
    <rect x="450" y="520" width="330" height="80" rx="40" fill="url(#pillTeal)" stroke="#14b8a6" stroke-width="2"/>
    <text x="486" y="551" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5eead4">FIRST-PASS RATE</text>
    <text x="486" y="582" font-size="24" font-weight="800" fill="#f1f5f9">90%<tspan dx="10" fill="#e2e8f0">of functions</tspan></text>
  </g>
  <g>
    <rect x="810" y="520" width="330" height="80" rx="40" fill="url(#pillGreen)" stroke="#22c55e" stroke-width="2"/>
    <text x="846" y="551" font-size="14" font-weight="700" letter-spacing="2.5" fill="#86efac">PRODUCTION INCIDENTS</text>
    <text x="846" y="582" font-size="24" font-weight="800" fill="#f1f5f9">0<tspan dx="10" fill="#e2e8f0">through rollout</tspan></text>
  </g>
</svg>
